
services:
  # Angular Frontend
  frontend:
    build:
      dockerfile: api/Dockerfile
      context: ./ui
      target: development
    command: npm run start
    volumes:
      - ./ui:/andrei/frontend/src/app
      - /andrei/frontend/src/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - api

  # NestJS Todo Api
  api:
    build:
      dockerfile: api/Dockerfile
      context: ./api
      # Only build development stage from our dockerfile
      target: development
    volumes:
      - ./api:/andrei/src/app
      - /andrei/src/app/node_modules
    # dev mode: npm run start:dev / debug: npm run start:debug
    command: npm run start:dev
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/db
      JWT_SECRET: hlaskdhaio1237891aa
    ports:
      - "3000:3000"

  postgres:
    image: postgres:14.8
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "35000:5432"


  postgres_admin:
    image: dpage/pgadmin4:latest
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - 5050:80
